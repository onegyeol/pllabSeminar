<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        html, body, #map{
            height: 100%;
        }
    </style>
    <script src="//code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        $(document).ready(function () {
            function setMarker(latitude, longtitude){
                var marker = new google.maps.Marker({
                    position: new google.maps.LatLng(latitude, longtitude),
                    map: map
                });
            }

            var name = prompt('이름을 입력하세요.', '이름');
            var socket = io.connect();

            var temp = document.getElementById('map');
            var map = new google.maps.Map(temp, {
                zoom: 6,
                center: new google.map.LatLng(37, 126),
                mapTypeId: google.maps.mapTypeId.ROADMAP
            });

            $.getJSON('/ShowData', {name: name}, function (data){
                $.each(data, function(index, item) {
                    setMarker(item.latitude, item.longtitude);
                });
            });

            socket.on('receive', function(data){
                setMarker(data.latitude, data.longtitude);
            });
        });
    </script>
</head>
<body>
    <div id="map">
        
    </div>
</body>
</html>
